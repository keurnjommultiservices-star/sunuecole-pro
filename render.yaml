# Blueprint Render : service web + base PostgreSQL
# Render > New > Blueprint > choisir ce dépôt GitHub
services:
  - type: web
    name: sunuecole-pro
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sunuecole-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SUPERADMIN_USERNAME
        value: kms
      - key: SUPERADMIN_PASSWORD
        sync: false          # à saisir dans le tableau de bord Render (10 caractères min.)

databases:
  - name: sunuecole-db
    plan: free
    databaseName: sunuecole
    user: sunuecole
